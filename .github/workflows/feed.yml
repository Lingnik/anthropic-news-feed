name: feed

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_feed.py
      - run: python3 tests/test_x_feed.py
      - id: x
        run: python3 x_feed.py
      - run: python3 feed.py
      - name: Commit when the feed changed
        run: |
          git add seen.json x_seen.json feed.xml
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "feed: update"
          git push
      - name: Alert on three failed X fetches in a row
        if: steps.x.outputs.alert != ''
        run: |
          echo "::error::fxtwitter fetch failed 3 runs in a row for: ${{ steps.x.outputs.alert }}"
          exit 1
